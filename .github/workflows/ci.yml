name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt "ruff==0.14.*" pytest
      - run: ruff check scripts/eval_playlist.py tests/test_eval_playlist.py tests/test_key_extraction.py src/recommender/playlist_sampler.py tests/test_playlist_sampler.py generate_playlist.py
      - run: python -m pytest -q
